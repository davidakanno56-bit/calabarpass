<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Medallion Gradient: Dark Titanium -->
    <linearGradient id="medallion-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="45%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#070C15" />
    </linearGradient>

    <!-- Outer Rim Metallic Bevel -->
    <linearGradient id="medallion-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="25%" stop-color="#475569" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Inner Metallic Highlight Line -->
    <linearGradient id="inner-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0.15)" />
    </linearGradient>

    <!-- Brushed Platinum / Steel Gradient for 'C' (Light from top-left) -->
    <linearGradient id="metal-c" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#E2E8F0" />
      <stop offset="38%" stop-color="#94A3B8" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="72%" stop-color="#64748B" />
      <stop offset="90%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Brushed Titanium / Steel Gradient for 'P' (Cross-grain highlight) -->
    <linearGradient id="metal-p" x1="85%" y1="15%" x2="15%" y2="95%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="22%" stop-color="#CBD5E1" />
      <stop offset="42%" stop-color="#64748B" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="78%" stop-color="#475569" />
      <stop offset="92%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Dimensional Bevel Stroke Gradient -->
    <linearGradient id="bevel-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)" />
      <stop offset="50%" stop-color="rgba(148, 163, 184, 0.2)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>

    <!-- StateCyan Subtle Edge Sheen -->
    <linearGradient id="cyan-edge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Interlocking Drop Shadow -->
    <filter id="interlock-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Deep Monogram Drop Shadow onto Medallion -->
    <filter id="medallion-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Brushed Metal Fine Texture Pattern -->
    <pattern id="brushed-grain" width="4" height="4" patternTransform="rotate(40 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="rgba(255, 255, 255, 0.03)" stroke-width="0.8" />
      <line x1="2" y1="0" x2="2" y2="4" stroke="rgba(0, 0, 0, 0.05)" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- 1. Medallion Outer Bevel & Background -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#medallion-base)" stroke="url(#medallion-rim)" stroke-width="2.2" />
  <!-- Brushed Texture on Medallion Surface -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#brushed-grain)" pointer-events="none" />
  <!-- Inner Highlight Line for Dimensional Recessed Effect -->
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="url(#inner-rim)" stroke-width="1.2" />

  <!-- 2. Monogram Geometry: Interlocking 'C' and 'P' -->
  <g filter="url(#medallion-depth)">
    
    <!-- LAYER A: 'C' Bottom & Middle Arc (Underneath the stem of P) -->
    <!-- Sweeps from left (x=21) down along bottom (y=94) to bottom-right (x=77, y=82) -->
    <path 
      d="M 21 60 C 21 76 31 91 49 94 C 59 95.5 69.5 91.5 77 82 L 67.5 73.5 C 62 79.5 54.5 81.5 48.5 80 C 37 77 32 68.5 32 60 H 21 Z" 
      fill="url(#metal-c)" 
      stroke="url(#bevel-stroke)" 
      stroke-width="0.8" 
    />

    <!-- LAYER B: 'P' Full Letter (Stem and Loop) -->
    <!-- Vertical stem: x=58 to x=70.5, y=26 to y=94. Outer loop: x=70.5 to x=99, y=26 to y=63 -->
    <path 
      d="M 58 26 H 83 C 94.5 26 101.5 33.5 101.5 44.5 C 101.5 55.5 94.5 63 83 63 H 70.5 V 94 H 58 V 26 Z 
         M 70.5 37.5 V 51.5 H 82 C 86.5 51.5 89.5 48.5 89.5 44.5 C 89.5 40.5 86.5 37.5 82 37.5 H 70.5 Z" 
      fill="url(#metal-p)" 
      stroke="url(#bevel-stroke)" 
      stroke-width="0.8"
      fill-rule="evenodd"
    />

    <!-- Shadow cast by 'P' stem onto bottom arc of 'C' -->
    <rect x="58" y="72" width="12.5" height="22" fill="#000000" opacity="0.35" filter="url(#interlock-shadow)" />

    <!-- LAYER C: 'C' Top Arc (Weaving OVER the vertical stem of 'P') -->
    <!-- Starts at left side (x=21, y=60), curves up to crest (y=26), sweeps across stem of P (x=58-70.5), into loop of P (ending at x=78, y=42) -->
    <path 
      d="M 21 60 H 32 C 32 51.5 37 43 48.5 40 C 54.5 38.5 62 40.5 67.5 46.5 L 77 38 C 69.5 28.5 59 24.5 49 26 C 31 29 21 44 21 60 Z" 
      fill="url(#metal-c)" 
      stroke="url(#bevel-stroke)" 
      stroke-width="0.8"
      filter="url(#interlock-shadow)"
    />

    <!-- Subtle brushed texture overlay specifically on the monogram letters -->
    <path 
      d="M 21 60 C 21 76 31 91 49 94 C 59 95.5 69.5 91.5 77 82 L 67.5 73.5 C 62 79.5 54.5 81.5 48.5 80 C 37 77 32 68.5 32 60 C 32 51.5 37 43 48.5 40 C 54.5 38.5 62 40.5 67.5 46.5 L 77 38 C 69.5 28.5 59 24.5 49 26 C 31 29 21 44 21 60 Z
         M 58 26 H 83 C 94.5 26 101.5 33.5 101.5 44.5 C 101.5 55.5 94.5 63 83 63 H 70.5 V 94 H 58 V 26 Z 
         M 70.5 37.5 V 51.5 H 82 C 86.5 51.5 89.5 48.5 89.5 44.5 C 89.5 40.5 86.5 37.5 82 37.5 H 70.5 Z" 
      fill="url(#brushed-grain)" 
      fill-rule="evenodd"
      pointer-events="none" 
      opacity="0.7"
    />

    <!-- Brushed Light Sheen Highlights (Precision Bevel Edges) -->
    <!-- Top crest highlight on C -->
    <path d="M 33 50 C 37 40 45 32 56 29" stroke="rgba(255, 255, 255, 0.55)" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <!-- Top crest highlight on P loop -->
    <path d="M 64 28 H 82 C 90 28 97 33 98 40" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <!-- Bottom curve specular rim on C -->
    <path d="M 33 70 C 37 80 45 88 56 91" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" stroke-linecap="round" fill="none" />
    <!-- Stem vertical bevel line on P -->
    <line x1="59.5" y1="28" x2="59.5" y2="92" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.9" />
  </g>
</svg>
